[package]
name = "shopping-sessions-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[[bin]]
name = "shopping-fast"
path = "pipeline/fast.rs"

[dependencies]
bytes = "=1.12.2"
parquet = { version = "=55.2.0", default-features = false, features = ["snap"] }
serde_json = "=1.0.145"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
